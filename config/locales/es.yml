  yard_areas:
    guide:
      title: "Guía rápida: áreas y secciones"
      intro: "Las áreas agrupan posiciones del patio para un cliente; dentro de cada área, las secciones separan sus posiciones (por ejemplo, por MBL)."
      areas:
        icon: "map"
        title: "1. Crear un área"
        steps:
          - "Entra a Áreas y pulsa «Nueva área»."
          - "Captura un código y un nombre, elige el bloque del patio y, si aplica, el cliente."
          - "Guarda. El área queda activa; desactívala si dejas de usarla."
      sections:
        icon: "layers"
        title: "2. Crear secciones"
        steps:
          - "Abre el área y, en «Nueva sección», escribe un nombre."
          - "Opcional: elige un MBL del cliente del área. Un área puede tener varias secciones."
      slots:
        icon: "add_location_alt"
        title: "3. Asignar posiciones a una sección"
        steps:
          - "En la sección, indica el rango de bahías (desde y hasta)."
          - "Marca las filas y los niveles que quieras incluir."
          - "Pulsa «Asignar posiciones». Las que ya pertenecen a otra sección activa se omiten y el mensaje te lo indica."
          - "Para quitar posiciones, usa los mismos campos y pulsa «Liberar posiciones». Debajo del nombre de la sección verás un resumen de lo asignado."
      map:
        icon: "view_in_ar"
        title: "4. Verlas en el mapa 3D"
        steps:
          - "Entra a Patio y pulsa el botón «Áreas» sobre el mapa."
          - "Cada sección se colorea y la leyenda indica su área, cliente y MBL; las posiciones sin sección salen en gris."
          - "Toca una posición para ver su código y su sección. Con el botón apagado el mapa vuelve a mostrar habilitadas y deshabilitadas."
      tip: "Una posición solo puede pertenecer a una sección activa. Si desactivas una sección, sus posiciones quedan disponibles para otra."
